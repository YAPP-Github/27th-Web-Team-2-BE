oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
  redirect:
    success-url: ${OAUTH_SUCCESS_URL:http://localhost:3000/auth/callback}
    failure-url: ${OAUTH_FAILURE_URL:http://localhost:3000/auth/failure}
    domains:
      local: ${OAUTH_REDIRECT_DOMAIN_LOCAL:http://localhost:3000}
      sandbox: ${OAUTH_REDIRECT_DOMAIN_SANDBOX:https://dev.weddin.kr}
      prod: ${OAUTH_REDIRECT_DOMAIN_PROD:https://weddin.kr}
