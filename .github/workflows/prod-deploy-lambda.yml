name: Deploy Lambda to Prod

on:
  workflow_dispatch:
    inputs:
      deploy_module:
        description: '배포할 모듈을 선택하세요'
        required: true
        type: choice
        options:
          - api

env:
  AWS_REGION: ap-northeast-2
  PHASE: prod

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check ktlint format
        run: ./gradlew ktlintCheck

      - name: Run tests
        run: ./gradlew test

  deploy:
    name: Deploy Lambda ${{ github.event.inputs.deploy_module }}
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !failure() }}
    environment: prod

    steps:
      - name: Set deployment config
        run: |
          case "${{ github.event.inputs.deploy_module }}" in
            api)
              echo "ECR_REPOSITORY=prod-app-lambda" >> $GITHUB_ENV
              echo "LAMBDA_FUNCTION=prod-app-lambda" >> $GITHUB_ENV
              echo "LAMBDA_ALIAS=live" >> $GITHUB_ENV
              ;;
            *)
              echo "❌ Unknown deploy module: ${{ github.event.inputs.deploy_module }}"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Lambda image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/api/Dockerfile.lambda
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            PHASE=${{ env.PHASE }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Lambda function when it already exists
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          if aws lambda get-function --function-name "$LAMBDA_FUNCTION" >/dev/null 2>&1; then
            VERSION="$(aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION" \
              --image-uri "$IMAGE_URI" \
              --publish \
              --query 'Version' \
              --output text)"

            aws lambda wait function-updated \
              --function-name "$LAMBDA_FUNCTION"

            if aws lambda get-alias --function-name "$LAMBDA_FUNCTION" --name "$LAMBDA_ALIAS" >/dev/null 2>&1; then
              aws lambda update-alias \
                --function-name "$LAMBDA_FUNCTION" \
                --name "$LAMBDA_ALIAS" \
                --function-version "$VERSION"
            else
              aws lambda create-alias \
                --function-name "$LAMBDA_FUNCTION" \
                --name "$LAMBDA_ALIAS" \
                --function-version "$VERSION"
            fi

            if aws lambda get-provisioned-concurrency-config --function-name "$LAMBDA_FUNCTION" --qualifier "$LAMBDA_ALIAS" >/dev/null 2>&1; then
              for attempt in $(seq 1 60); do
                STATUS="$(aws lambda get-provisioned-concurrency-config \
                  --function-name "$LAMBDA_FUNCTION" \
                  --qualifier "$LAMBDA_ALIAS" \
                  --query 'Status' \
                  --output text)"

                if [ "$STATUS" = "READY" ]; then
                  break
                fi

                if [ "$STATUS" = "FAILED" ]; then
                  aws lambda get-provisioned-concurrency-config \
                    --function-name "$LAMBDA_FUNCTION" \
                    --qualifier "$LAMBDA_ALIAS"
                  exit 1
                fi

                if [ "$attempt" -eq 60 ]; then
                  echo "Provisioned concurrency did not become READY within 10 minutes."
                  exit 1
                fi

                sleep 10
              done
            fi

            cat > warmup-payload.json <<'JSON'
            {
              "version": "2.0",
              "routeKey": "GET /ping",
              "rawPath": "/ping",
              "rawQueryString": "",
              "headers": {
                "host": "lambda-api.moit.kr"
              },
              "requestContext": {
                "http": {
                  "method": "GET",
                  "path": "/ping",
                  "protocol": "HTTP/1.1",
                  "sourceIp": "127.0.0.1",
                  "userAgent": "github-actions-lambda-warmup"
                },
                "requestId": "github-actions-lambda-warmup",
                "routeKey": "GET /ping",
                "stage": "$default"
              },
              "isBase64Encoded": false
            }
          JSON

            aws lambda invoke \
              --function-name "$LAMBDA_FUNCTION" \
              --qualifier "$LAMBDA_ALIAS" \
              --cli-binary-format raw-in-base64-out \
              --payload fileb://warmup-payload.json \
              warmup-response.json

            if ! jq -e '.statusCode == 200' warmup-response.json >/dev/null; then
              cat warmup-response.json
              exit 1
            fi

            echo "✅ Lambda function updated: $LAMBDA_FUNCTION:$LAMBDA_ALIAS -> version $VERSION"
          else
            echo "ℹ️ Lambda function does not exist yet. Image pushed only: $IMAGE_URI"
            echo "Run Terraform Apply with enable_lambda_api=true and lambda_image_tag=${IMAGE_TAG}."
          fi

      - name: Send Discord Notification (Success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            THREAD_NAME="[prod] Lambda ${{ github.event.inputs.deploy_module }} 배포 성공"
            MESSAGE="- Actor: ${{ github.actor }}\n- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"$MESSAGE\", \"thread_name\": \"$THREAD_NAME\"}"
          fi

      - name: Send Discord Notification (Failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            THREAD_NAME="❌ [prod] Lambda ${{ github.event.inputs.deploy_module }} 배포 실패"
            MESSAGE="- Actor: ${{ github.actor }}\n- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"$MESSAGE\", \"thread_name\": \"$THREAD_NAME\"}"
          fi
